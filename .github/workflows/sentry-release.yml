name: Sentry release

# Creates the Sentry release for each version tag, links the commits since the last release, finalizes it
# and records a production deploy. Problem reports from the app are tagged "localsites@<version>"
# (internal/problems/send.go), so the name here must stay exactly the same.
#
# Needs the SENTRY_AUTH_TOKEN repository secret (an organization auth token from Sentry).
# To backfill an older version: Actions → Sentry release → Run workflow, and enter its tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create in Sentry, for example v1.1.0"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check the auth token is set
        id: token
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN is not set, so no Sentry release was created. Add it under Settings → Secrets and variables → Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            case "$SENTRY_AUTH_TOKEN" in
              sntrys_*|sntryu_*) ;;
              *) echo "::error::SENTRY_AUTH_TOKEN doesn't look like a Sentry auth token (they start with sntrys_). Save it again: copy the token in Sentry, then run gh secret set SENTRY_AUTH_TOKEN in Terminal and paste it at the prompt."; exit 1 ;;
            esac
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.token.outputs.ok == 'true'
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # linking commits needs the full history
      - name: Release name and commit range
        if: steps.token.outputs.ok == 'true'
        id: name
        # The range is given explicitly (the previous version tag up to this one). Sentry's automatic
        # range starts from the commit it stored for the last release, and that commit no longer exists
        # after a history rewrite (2026-11-14), which made "set-commits --auto" fail.
        run: |
          echo "release=localsites@${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse "${TAG}^{commit}")" >> "$GITHUB_OUTPUT"
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            echo "previous=$(git rev-parse "${prev}^{commit}")" >> "$GITHUB_OUTPUT"
            echo "mode=manual" >> "$GITHUB_OUTPUT"
            echo "Commits from $prev to $TAG"
          else
            echo "mode=auto" >> "$GITHUB_OUTPUT" # the first release: no earlier tag
          fi
      - name: Create the Sentry release, link commits, finalize, record the deploy
        id: linked
        if: steps.token.outputs.ok == 'true'
        continue-on-error: true # linking commits needs Sentry's GitHub integration; see the next step
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: pixel-perfection-ru
          SENTRY_PROJECT: localsites
        with:
          release: ${{ steps.name.outputs.release }}
          environment: production
          finalize: true
          set_commits: ${{ steps.name.outputs.mode }}
          repo: ${{ github.repository }}
          commit: ${{ steps.name.outputs.commit }}
          previous_commit: ${{ steps.name.outputs.previous }}
          ignore_missing: true
      - name: Create the release without commits (Sentry doesn't know this repository yet)
        if: steps.token.outputs.ok == 'true' && steps.linked.outcome == 'failure'
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: pixel-perfection-ru
          SENTRY_PROJECT: localsites
        with:
          release: ${{ steps.name.outputs.release }}
          environment: production
          finalize: true
          set_commits: skip
      - name: Say how to get commits on releases
        if: steps.token.outputs.ok == 'true' && steps.linked.outcome == 'failure'
        run: echo "::warning::The Sentry release was created without commits, because Sentry isn't connected to ${GITHUB_REPOSITORY}. In Sentry, open Settings → Integrations → GitHub, install it for this repository (or add the repository there), then rerun this workflow for the tag."
