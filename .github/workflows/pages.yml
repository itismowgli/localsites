name: Website
on:
  push:
    branches: [master]
    paths: ["site/**", "docs/screenshots/**", "docs/brand/**", ".github/FUNDING.yml", "tools/support.mjs", ".github/workflows/pages.yml", "README.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Put the page, screenshots and icons together
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R docs/screenshots _site/screenshots
          cp -R docs/brand _site/brand
          mkdir -p _site/fonts && cp desktop/frontend/dist/fonts/* _site/fonts/
          # the README as plain Markdown for language models (llms.txt links to it); drops the HTML-only lines
          grep -vE '^\s*<(img|div|/div|br|details|/details|summary)|^\[!\[|^<!-- ' README.md > _site/llms-full.txt
      - name: Turn the support options on or off (from .github/FUNDING.yml)
        run: node tools/support.mjs --site _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
