name: Website
on:
  push:
    branches: [master]
    paths: ["site/**", "site-src/**", "tools/build-site.mjs", "docs/screenshots/**", "docs/brand/**", ".github/FUNDING.yml", "tools/support.mjs", "tools/cachebust.mjs", ".github/workflows/pages.yml", "README.md", "internal/version/version.go"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, for the sitemap's last-changed dates
      - name: Put the pages, screenshots and icons together
        run: |
          node tools/build-site.mjs --check   # site/*.html match site-src/
          mkdir -p _site
          cp -R site/. _site/
          node tools/build-site.mjs --sitemap _site/sitemap.xml   # every page, with the date it last changed
          cp -R docs/screenshots _site/screenshots
          cp -R docs/brand _site/brand
          mkdir -p _site/fonts && cp desktop/frontend/dist/fonts/* _site/fonts/
          # the README as plain Markdown for language models (llms.txt links to it); drops the HTML-only lines
          grep -vE '^\s*<(img|div|/div|br|details|/details|summary)|^\[!\[|^<!-- ' README.md > _site/llms-full.txt
      - name: Version from the code (internal/version/version.go)
        run: |
          v=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/version/version.go)
          test -n "$v"
          sed -i "s/{{version}}/$v/g" _site/*.html _site/llms.txt
      - name: Turn the support options on or off (from .github/FUNDING.yml)
        run: node tools/support.mjs --site _site/*.html
      - name: Fingerprint image, font, style and script links (?v=<content hash>), so changed files are never served from a cache
        run: node tools/cachebust.mjs _site/*.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
