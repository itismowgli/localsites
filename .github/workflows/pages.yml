name: Website
on:
  push:
    branches: [master]
    paths: ["site/**", "docs/screenshots/**", "docs/brand/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Put the page, screenshots and icons together
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R docs/screenshots _site/screenshots
          cp -R docs/brand _site/brand
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
