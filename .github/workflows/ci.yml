name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint (gofmt, go vet, JavaScript syntax, no container queries)
        run: make lint
      - name: Unit tests
        run: go test ./...
      - name: Build CLI
        run: make cli
      - name: Engine and CLI compile for Linux and Windows
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/...
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/...

  linux:
    # Ubuntu 24.04 (x86_64): unit tests, the desktop app, and the end-to-end suite with Homebrew's
    # Apache, MySQL 8.4 and PHP, set up the way LocalSites does it on Linux.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: GTK and WebKitGTK for the desktop app
        run: sudo apt-get update -q && sudo apt-get install -y -q libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Unit tests
        run: go test -tags webkit2_41 ./...
      - name: Desktop app builds
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          cd desktop && wails build -tags webkit2_41 -trimpath -o LocalSites
      - name: Apache, MySQL 8.4 and PHP from Homebrew
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install httpd
          # The runner has a system MySQL whose /etc/mysql/my.cnf breaks Homebrew's own post-install step
          # (it only creates Homebrew's sample data folder, which LocalSites doesn't use; LocalSites starts
          # MySQL with its own --defaults-file). Keep that file: the tests then run next to a system MySQL.
          brew install mysql@8.4 || test -x "$(brew --prefix mysql@8.4)/bin/mysqld"
          brew tap shivammathur/php && (brew trust shivammathur/php || true)
          brew install shivammathur/php/php@8.5
      - name: End-to-end tests
        run: go test -tags e2e -count=1 -timeout 20m ./e2e/
