name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint (gofmt, go vet, JavaScript syntax, no container queries)
        run: make lint
      - name: Unit tests
        run: go test ./...
      - name: Build CLI
        run: make cli
      - name: Engine and CLI compile for Linux and Windows
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/...
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/...
