name: Linux builds
# Builds the Linux programs (the app and the CLI) for x86_64 and arm64 when a version tag is pushed.
# `make release` on the maintainer's Mac downloads them, packages them as .deb and .rpm, signs the .rpm and
# the update manifest with keys that never leave that Mac, then publishes the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build tools
        timeout-minutes: 20   # a stalled package mirror fails instead of hanging the release
        run: |
          # The runner picks mirrors from /etc/apt/apt-mirrors.txt and its first one is sometimes very slow:
          # Ubuntu's Azure mirror goes first, the main archive after it
          printf '%s\n' http://azure.archive.ubuntu.com/ubuntu/ http://archive.ubuntu.com/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update -q && sudo apt-get $APT install -y -q libgtk-3-dev libwebkit2gtk-4.1-dev imagemagick
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: App, CLI and icons
        run: make linux-binaries
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            desktop/build/bin/LocalSites
            bin/localsites-linux
            dist/linux/*.png
          if-no-files-found: error
