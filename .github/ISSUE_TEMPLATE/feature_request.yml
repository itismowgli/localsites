name: Feature request
description: Suggest something LocalSites should do
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What would you like to do?
      description: The task you're trying to get done, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Anything else
      description: How you do it now, other tools you've used, screenshots.
